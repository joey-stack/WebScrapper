name: 24/7 Autonomous CRM Lead Acquisition Autopilot

on:
  schedule:
    # 07:30 UTC = 08:30 AM West Africa Time (WAT) Monday-Friday
    - cron: '30 7 * * 1-5'
    # 12:15 UTC = 01:15 PM West Africa Time (WAT) Monday-Friday
    - cron: '15 12 * * 1-5'
    # 15:45 UTC = 04:45 PM West Africa Time (WAT) Monday-Friday
    - cron: '45 15 * * 1-5'

  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of outreach emails to dispatch'
        required: false
        default: '15'
      dry_run:
        description: 'Run in Dry Run mode (do not send real emails)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-autopilot:
    name: Run Cloud Acquisition Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Headless Browser
        run: |
          playwright install --with-deps chromium

      - name: Ensure Temporary Directory Exists
        run: |
          mkdir -p .tmp

      - name: Execute Autonomous CRM Acquisition Cycle
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER || 'imap.gmail.com' }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SENDER_NAME: ${{ secrets.SENDER_NAME || 'Joel Adawah' }}
          MY_WHATSAPP_NUMBER: ${{ secrets.MY_WHATSAPP_NUMBER || '2348183292909' }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          CALENDAR_BOOKING_URL: ${{ secrets.CALENDAR_BOOKING_URL || 'https://calendar.app.google/2fwgMoDCUJNtog736' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'joel_adawah_leads_alert' }}
        run: |
          LIMIT_VAL="${{ inputs.limit || '15' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python execution/run_continuous_autopilot.py --once --limit $LIMIT_VAL --dry-run
          else
            python execution/run_continuous_autopilot.py --once --limit $LIMIT_VAL
          fi

      - name: Persist Updated Leads Database & Performance Ledger
        run: |
          git config --global user.name "GitHub Actions Autopilot"
          git config --global user.email "autopilot@github-actions.local"
          git add .tmp/gmb_leads_combined.csv .tmp/pitch_performance_ledger.json || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(crm): update leads database & pitch ledger [skip ci]"
            git push
          fi
